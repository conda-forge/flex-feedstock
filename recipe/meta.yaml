{% set version = "2.6.11" %}

package:
  name: flex
  version: {{ version }}

source:
  url: https://github.com/westes/flex/releases/download/v{{ version }}/flex-{{ version }}.tar.gz
  sha256: 188e9c96b8fc032b2a0bdd24d4f0b692480c1854511c2fcc3034946f14fdf49a

build:
  skip: true  # [win]
  number: 0
  detect_binary_files_with_prefix: true

requirements:
  build:
    - libtool  # [unix]
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
    - automake
    - m4
    - make      # [unix]
    - libiconv  # [not linux and not win]
    - help2man  # [not win]
  run:
    - libiconv  # [not linux and not win]
    - m4

test:
  commands:
    # CLI tests
    - flex --help

    # Include test
    - test -f ${PREFIX}/include/FlexLexer.h

    # Lib tests
    - test -f ${PREFIX}/lib/libfl.a
    - test -f ${PREFIX}/lib/libfl${SHLIB_EXT}  # [not win]

about:
  home: http://flex.sourceforge.net/
  license: BSD 2-Clause
  license_file: COPYING
  license_family: BSD
  summary: The Fast Lexical Analyzer

extra:
  recipe-maintainers:
    - jakirkham
    - ocefpaf
